# Render Blueprint: one-click deploy of the API, its Postgres database and
# the admin web dashboard. In Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: attendance-check-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-check-db
          property: connectionString
      # Google integrations are optional; fill them in on the dashboard.
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false

  - type: web
    name: attendance-check-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://attendance-check-api.onrender.com/api

databases:
  - name: attendance-check-db
    databaseName: attendance_fine_db
    plan: free
